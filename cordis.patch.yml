# Semble MCP bridge for DeepSeek Harness.
#
# Inserts the official @deepseek-ai/dsh-mcp-client row configured to start the
# Semble MCP server (PyPI project `semble`, MIT, https://github.com/MinishLab/semble)
# over stdio. No semble source code is vendored here: `uvx` resolves and installs
# the package from PyPI, so upstream releases (bugfixes, new MCP tools) are picked
# up automatically on the next server start.
#
# Platform policy: this file deliberately contains no OS-specific path and no
# region-specific endpoint. `command: uvx` is a real executable on every platform
# uv supports (uvx.exe on Windows, uvx on macOS/Linux), resolved through PATH, so
# the same row works unchanged everywhere. Everything an operator may need to
# adapt — repository paths, proxies, mirrors — belongs in the plugin settings,
# not in the shipped default.
#
# Version policy: floating spec `semble[mcp]` follows the latest release.
# To pin a specific version for stability, edit this row in the DSH plugin
# settings and change the spec to `semble[mcp]==X.Y.Z`.
- insert:
    # Host-side anchor row: an empty plugin loaded under this package's own name.
    # DSH's plugin inventory (and the Plugin Hub) decide "loaded" by matching loader
    # entry names against the installed package name, and the MCP client row below
    # loads under @deepseek-ai/dsh-mcp-client — without this anchor the bundle would
    # report 未加载 / 待重启 while its tools are actually registered and working.
    - id: semble-mcp-anchor
      name: '@local/semble-mcp'

    - id: semble-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: semble
        transport: stdio
        command: uvx
        args:
          - --from
          - 'semble[mcp]'
          - semble
        failOnStartupError: true
        # No `env` defaults on purpose: the embedding model
        # (minishlab/potion-code-16M-v2) is fetched from huggingface.co unless the
        # operator asks otherwise. On networks where huggingface.co is unreachable,
        # add the following in the plugin settings rather than here:
        #
        #   HF_ENDPOINT: https://hf-mirror.com
        #
        # `cwd` is intentionally unset too: the server inherits the host working
        # directory, and per-call `repo` values should be absolute paths in the
        # host's own convention (C:\... on Windows, /... on macOS/Linux).
