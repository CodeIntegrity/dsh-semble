# Semble code-search bundle for DeepSeek Harness.
#
# Since 3.0.0 this bundle does not load an MCP server. A single loader row
# loads this package itself, and the plugin registers its two native tools
# (semble_search / semble_find_related) directly into the host tool registry.
# No semble source code is vendored here: every call shells out to
# `uvx --from "semble[mcp]" semble`, so `uvx` resolves and installs the package
# from PyPI and upstream releases (bugfixes, new CLI flags) are picked up on
# the next call.
#
# The row's `config` is passed to the plugin (apply(ctx, config)) and becomes
# the launcher settings for the tools: `command`/`args` launch the CLI,
# `toolTimeoutMs` kills a search after this many milliseconds, `env` is layered
# onto the child environment. The values below are pinned by
# test/consistency.test.js to equal the defaults lib/tools.js applies when a
# field is omitted or mistyped.
#
# Platform policy: this file deliberately contains no OS-specific path and no
# region-specific endpoint. `command: uvx` is a real executable on every platform
# uv supports (uvx.exe on Windows, uvx on macOS/Linux), resolved through PATH, so
# the same row works unchanged everywhere. Everything an operator may need to
# adapt — repository paths, proxies, mirrors — belongs in the plugin settings,
# not in the shipped default.
#
# Version policy: floating spec `semble[mcp]` follows the latest release.
# To pin a specific version for stability, edit this row in the DSH plugin
# settings and change the spec to `semble[mcp]==X.Y.Z`.
- insert:
    # The only loader row. DSH's plugin inventory (and the Plugin Hub) decide
    # "loaded" by matching loader entry names against the installed package
    # name, so this row is named after the package itself and the bundle
    # reports loaded with nothing else declared.
    - id: semble-anchor
      name: 'dsh-semble'
      config:
        command: uvx
        args:
          - --from
          - 'semble[mcp]'
          - semble
        # The first search in a repository also builds that repository's index:
        # chunking runs locally and the embedding model is downloaded once from
        # HuggingFace. That routinely exceeds a 60 s ceiling, which would fail
        # the first call even though the CLI is healthy. Five minutes covers a
        # cold start on a slow link; once an index exists, calls answer in
        # seconds and the higher ceiling costs nothing.
        toolTimeoutMs: 300000
        # No `env` defaults on purpose: the embedding model
        # (minishlab/potion-code-16M-v2) is fetched from huggingface.co unless the
        # operator asks otherwise. On networks where huggingface.co is unreachable,
        # add the following in the plugin settings rather than here:
        #
        #   HF_ENDPOINT: https://hf-mirror.com
        #
        # `cwd` is intentionally unset too: every call resolves its own
        # repositories, and `repo` values should be absolute paths in the host's
        # own convention (C:\... on Windows, /... on macOS/Linux).
